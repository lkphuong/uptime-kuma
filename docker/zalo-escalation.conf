UPTIME_KUMA_ZALO_ESCALATION=[{"interval_minutes":1,"template":"{{ name }} hiện đang không truy cập được, đã khoảng 10 phút rồi. Hỗ trợ kiểm tra giúp em với ạ."},{"interval_minutes":2,"template":"{{ name }} đã ngừng hoạt động được 20 phút rồi mà chưa thấy lên lại. Nhờ hỗ trợ kiểm tra sớm giúp em với ạ."},{"interval_minutes":3,"template":"{{ name }} vẫn chưa hoạt động trở lại, đã được 30 phút rồi. Nhờ hỗ trợ xem qua giúp với ạ."},{"interval_minutes":4,"template":"{{ name }} đã ngừng hoạt động được 1 tiếng rồi. Tình trạng có vẻ kéo dài, nhờ hỗ trợ ưu tiên xử lý giúp ạ."},{"interval_minutes":5,"template":"{{ name }} vẫn chưa lên lại sau 1 tiếng rưỡi rồi. Gián đoạn hơi lâu, nhờ hỗ trợ xem lại sớm giúp em với ạ."},{"interval_minutes":120,"template":"{{ name }} đã downtime được 2 tiếng rồi mà vẫn chưa hoạt động lại. Nhờ hỗ trợ xem lại và xử lý sớm giúp với ạ."},{"interval_minutes":180,"template":"{{ name }} đã downtime 3 tiếng rồi mà vẫn chưa lên lại. Rất cần sự hỗ trợ và xử lý sớm giúp, tình trạng đang khá nghiêm trọng rồi."},{"interval_minutes":240,"template":"{{ name }} đã ngừng hoạt động được 4 tiếng rồi. Tình trạng gián đoạn vẫn tiếp diễn, nhờ hỗ trợ ưu tiên xử lý giúp em với ạ."},{"interval_minutes":300,"template":"{{ name }} đã mất kết nối được 5 tiếng rồi mà vẫn chưa có dấu hiệu hoạt động lại. Rất nhờ hỗ trợ vào xử lý sớm giúp ạ."},{"interval_minutes":360,"template":"{{ name }} đã ngừng hoạt động được 6 tiếng rồi. Sự cố vẫn chưa được khắc phục, nhờ hỗ trợ ưu tiên xử lý giúp em với ạ."},{"interval_minutes":420,"template":"{{ name }} vẫn chưa lên lại sau 7 tiếng rồi. Tình trạng đang kéo dài khá lâu, rất nhờ anh/chị hỗ trợ xử lý khẩn giúp với ạ."},{"interval_minutes":480,"template":"{{ name }} đã downtime được 8 tiếng rồi mà chưa thể truy cập. Cần được xử lý sớm, rất nhờ hỗ trợ ưu tiên kiểm tra giúp ạ."},{"interval_minutes":540,"template":"{{ name }} đã ngừng hoạt động đến 9 tiếng rồi. Tình trạng rất đáng lo ngại, nhờ anh/chị ưu tiên vào xử lý giúp em với ạ."},{"interval_minutes":600,"template":"{{ name }} vẫn chưa có tín hiệu trở lại sau 10 tiếng downtime. Việc này cần được xử lý khẩn cấp, rất mong nhận được hỗ trợ sớm ạ."},{"interval_minutes":660,"template":"{{ name }} đã mất kết nối được 11 tiếng rồi mà vẫn chưa lên lại. Tình trạng đang rất nghiêm trọng, nhờ hỗ trợ khẩn cấp xử lý giúp với ạ."},{"interval_minutes":720,"template":"{{ name }} đã downtime 12 tiếng rồi mà vẫn chưa thể kết nối lại. Rất mong được hỗ trợ xử lý khẩn cấp ạ."},{"interval_minutes":960,"template":"{{ name }} đã ngừng hoạt động được 16 tiếng rồi. Sự cố kéo dài đang gây ảnh hưởng nghiêm trọng, rất nhờ hỗ trợ ưu tiên xử lý gấp giúp ạ."},{"interval_minutes":1080,"template":"{{ name }} đã downtime đến 18 tiếng rồi mà vẫn chưa lên lại. Cần được ứng cứu khẩn cấp, rất mong nhận được hỗ trợ xử lý sớm ạ."},{"interval_minutes":1440,"template":"{{ name }} đã ngừng hoạt động suốt 1 ngày nay. Tình trạng rất nghiêm trọng, rất cần các bên phối hợp vào cuộc khẩn cấp giúp với ạ."},{"interval_minutes":2160,"template":"{{ name }} đã downtime được 1 ngày rưỡi rồi mà vẫn chưa hoạt động bình thường. Rất mong được hỗ trợ ưu tiên xử lý khẩn cấp giúp ạ."},{"interval_minutes":2880,"template":"{{ name }} đã downtime đến 2 ngày rồi mà chưa thể khắc phục. Rất mong được sự hỗ trợ ưu tiên xử lý gấp để đưa dịch vụ hoạt động trở lại ạ."},{"interval_minutes":4320,"template":"{{ name }} đã ngừng hoạt động suốt 3 ngày nay rồi. Tình trạng cực kỳ nghiêm trọng, rất khẩn nhờ anh/chị ưu tiên vào cuộc xử lý ngay giúp với ạ."}]
UPTIME_KUMA_ZALO_RECOVERY_TEMPLATE={{ name }} đã hoạt động trở lại. Cảm ơn mọi người đã hỗ trợ xử lý kịp thời, mọi thứ đã ổn rồi ạ!